name: 'Setup Test Cluster'
description: 'Creates a kind cluster with test pods for integration testing'

inputs:
  k8s-version:
    description: 'Kubernetes version for kind cluster'
    required: true
  kind-version:
    description: 'Kind version'
    required: true
  node-image:
    description: 'Digest-pinned node image published for the kind version'
    required: true
  cluster-name:
    description: 'Name for the kind cluster'
    required: false
    default: 'test-cluster'
  create-ubuntu:
    description: 'Create Ubuntu test pod'
    required: false
    default: 'true'
  create-alpine:
    description: 'Create Alpine test pod'
    required: false
    default: 'false'
  create-distroless:
    description: 'Create Distroless test pod'
    required: false
    default: 'false'
  wait-timeout:
    description: 'Timeout for pod readiness'
    required: false
    default: '120s'

runs:
  using: 'composite'
  steps:
    - name: Create kind cluster
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        version: ${{ inputs.kind-version }}
        node_image: ${{ inputs.node-image }}
        kubectl_version: ${{ inputs.k8s-version }}
        cluster_name: ${{ inputs.cluster-name }}
        wait: 60s

    - name: Verify cluster
      shell: bash
      run: |
        kubectl cluster-info
        kubectl get nodes
        kubectl version

    - name: Create test pods
      shell: bash
      env:
        CREATE_UBUNTU: ${{ inputs.create-ubuntu }}
        CREATE_ALPINE: ${{ inputs.create-alpine }}
        CREATE_DISTROLESS: ${{ inputs.create-distroless }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        # Ubuntu pod
        if [ "$CREATE_UBUNTU" = "true" ]; then
          echo "Creating Ubuntu test pod..."
          kubectl run test-ubuntu --image=ubuntu:24.04 --restart=Never -- sleep infinity
        fi

        # Alpine pod
        if [ "$CREATE_ALPINE" = "true" ]; then
          echo "Creating Alpine test pod..."
          kubectl run test-alpine --image=alpine:3.18 --restart=Never -- sleep infinity
        fi

        # Distroless pod
        if [ "$CREATE_DISTROLESS" = "true" ]; then
          echo "Creating Distroless test pod..."
          kubectl run test-distroless --image=registry.k8s.io/pause:3.9 --restart=Never
        fi

        # Wait for pods to be Ready
        if [ "$CREATE_UBUNTU" = "true" ]; then
          kubectl wait --for=condition=Ready pod/test-ubuntu --timeout="$WAIT_TIMEOUT"
        fi
        if [ "$CREATE_ALPINE" = "true" ]; then
          kubectl wait --for=condition=Ready pod/test-alpine --timeout="$WAIT_TIMEOUT"
        fi
        if [ "$CREATE_DISTROLESS" = "true" ]; then
          kubectl wait --for=condition=Ready pod/test-distroless --timeout="$WAIT_TIMEOUT"
        fi

        kubectl get pods

    - name: Verify pods are operational
      shell: bash
      env:
        CREATE_UBUNTU: ${{ inputs.create-ubuntu }}
        CREATE_ALPINE: ${{ inputs.create-alpine }}
      run: |
        # Verify pods based on what was created
        if [ "$CREATE_UBUNTU" = "true" ]; then
          kubectl exec test-ubuntu -- /bin/bash -c "echo 'bash works'"
        fi

        if [ "$CREATE_ALPINE" = "true" ]; then
          kubectl exec test-alpine -- /bin/sh -c "echo 'sh works'"
        fi

        echo "✅ All requested test pods are operational"
