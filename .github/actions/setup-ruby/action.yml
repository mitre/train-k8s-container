name: Set up Ruby
description: Install Ruby and optionally cache bundled dependencies

inputs:
  ruby-version:
    description: Ruby version
    default: '3.3'
  bundler-cache:
    description: Install and cache bundled dependencies
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: ${{ inputs.bundler-cache }}
