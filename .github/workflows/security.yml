name: Security Audit

on:
  push:
    branches:
      - main
      - master
      - v2.0
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run weekly on Mondays at 6 AM UTC to catch new vulnerabilities
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Job 1: Secret Scanning with TruffleHog
  secret_scanning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for TruffleHog

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          path: ./

      - name: Secret scan summary
        if: always()
        run: |
          {
            echo "## 🔒 Secret Scanning Results"
            echo "Scanned for 800+ types of secrets and credentials"
            echo "✅ Secret scan completed - check logs for details"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 2: Dependency Vulnerability Scanning
  dependency_vulnerabilities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: $/.github/actions/setup-ruby
        with:
          bundler-cache: true

      - name: Run vulnerability scan
        run: bundle exec bundler-audit check --update --verbose

      - name: Vulnerability scan summary
        if: always()
        run: |
          {
            echo "## 🛡️ Dependency Vulnerability Scan"
            echo "Checked Gemfile.lock against Ruby Advisory Database"
            echo "✅ Scan completed - review logs for any vulnerabilities"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 3: SBOM Generation
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: $/.github/actions/setup-ruby
        with:
          bundler-cache: true

      - name: Inventory Ruby dependencies
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: syft-json
          output-file: ${{ runner.temp }}/syft.json
          dependency-snapshot: ${{ github.event_name == 'push' }}
          upload-artifact: false

      - name: Identify vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/syft.json
          output-format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          fail-build: false
          cache-db: true

      - name: Upload CycloneDX SBOM with vulnerability findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: SBOM generation summary
        if: always()
        run: |
          {
            echo "## 📦 Software Bill of Materials (SBOM)"
            echo "Generated CycloneDX SBOM in JSON format"
            echo "✅ SBOM artifact uploaded for 90-day retention"
            echo ""
            echo "### SBOM Contents Preview"
            echo '```json'
            head -n 20 "$RUNNER_TEMP/sbom.cdx.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  security_summary:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [secret_scanning, dependency_vulnerabilities, sbom]
    if: always()

    steps:
      - name: Generate security summary
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "# 🔐 Security Audit Summary"
            echo ""
            echo "All security checks completed for commit $COMMIT_SHA"
            echo ""
            echo "## Scan Results"
            echo "- 🔒 Secret Scanning: Completed"
            echo "- 🛡️ Vulnerability Scan: Completed"
            echo "- 📦 SBOM Generation: Completed"
            echo ""
            echo "ℹ️ This workflow provides security notifications and does not block builds."
            echo "Review individual job logs for detailed findings."
          } >> "$GITHUB_STEP_SUMMARY"
