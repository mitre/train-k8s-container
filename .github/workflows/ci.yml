name: CI

on:
  push:
    branches:
      - main
      - master
      - v2.0
      - 'feature/**'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kubernetes_versions:
    runs-on: ubuntu-latest
    outputs:
      kind_version: ${{ steps.versions.outputs.kind_version }}
      kubernetes: ${{ steps.versions.outputs.kubernetes }}
    steps:
      - name: Discover Kubernetes versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/kubernetes-sigs/kind/releases/latest)
          kind_version=$(jq -r '.tag_name' <<< "$release")
          kubernetes=$(jq -ce '
            [.body
             | scan("kindest/node:(v[0-9]+\\.[0-9]+\\.[0-9]+)@sha256:([a-f0-9]{64})")
             | {version: .[0], image: ("kindest/node:" + .[0] + "@sha256:" + .[1]),
                sort: (.[0] | ltrimstr("v") | split(".") | map(tonumber))}]
            | group_by(.sort[0:2])
            | map(max_by(.sort))
            | sort_by(.sort) | reverse | .[:3]
            | map(del(.sort))
            | if length == 3 then . else error("kind release must provide three Kubernetes minor versions") end
          ' <<< "$release")

          printf 'kind_version=%s\nkubernetes=%s\n' "$kind_version" "$kubernetes" | tee -a "$GITHUB_OUTPUT"

  # Job 1: Build gem (runs first, uploads artifact)
  build_gem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build gem
        uses: $/.github/actions/build-gem

      - name: Upload gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: train-k8s-container-gem
          path: train-k8s-container-*.gem
          retention-days: 5

  # Unit tests (no Kubernetes needed)
  unit_tests_matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: $/.github/actions/setup-ruby
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run unit tests
        run: bundle exec rspec --format documentation --format json --out "$RUNNER_TEMP/unit-results.json"

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-results-ruby-${{ matrix.ruby-version }}
          path: ${{ runner.temp }}/unit-results.json
          retention-days: 5

  # Job 3: Integration tests with kind cluster
  integration_tests_matrix:
    name: integration_tests_matrix (${{ matrix.ruby-version }}, ${{ matrix.kubernetes.version }})
    runs-on: ubuntu-latest
    needs: [build_gem, unit_tests, kubernetes_versions]
    # No CHEF_LICENSE needed - using Cinc Auditor (open-source, license-free)
    strategy:
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']
        kubernetes: ${{ fromJSON(needs.kubernetes_versions.outputs.kubernetes) }}

    steps:
      - name: Checkout code (needed for composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup test cluster with pods
        uses: $/.github/actions/setup-test-cluster
        with:
          k8s-version: ${{ matrix.kubernetes.version }}
          kind-version: ${{ needs.kubernetes_versions.outputs.kind_version }}
          node-image: ${{ matrix.kubernetes.image }}
          cluster-name: test-cluster
          create-ubuntu: 'true'
          create-alpine: 'true'
          create-distroless: 'true'

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: $/.github/actions/setup-ruby
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec integration tests
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: bundle exec rspec spec/integration --tag type:integration --format documentation --format json --out "$RUNNER_TEMP/integration-results.json"

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-results-ruby-${{ matrix.ruby-version }}-k8s-${{ matrix.kubernetes.version }}
          path: ${{ runner.temp }}/integration-results.json
          retention-days: 5

      - name: Download gem artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: train-k8s-container-gem

      - name: Setup Cinc Auditor with plugin
        uses: $/.github/actions/setup-cinc-auditor
        with:
          install-plugin: train-k8s-container-*.gem

      - name: Test with Cinc Auditor detect
        run: |
          cinc-auditor detect -t k8s-container:///test-ubuntu/test-ubuntu
          cinc-auditor detect -t k8s-container:///test-alpine/test-alpine

      - name: Test with Cinc Auditor shell
        run: |
          cinc-auditor shell -t k8s-container:///test-ubuntu/test-ubuntu --command "command('whoami').stdout"
          cinc-auditor shell -t k8s-container:///test-alpine/test-alpine --command "command('cat /etc/alpine-release').stdout"

      - name: Test distroless detection and shell error
        run: |
          echo "Testing distroless platform detection..."
          cinc-auditor detect -t k8s-container:///test-distroless/test-distroless
          echo "Expecting a shell-unavailable error..."
          exit_code=0
          output=$(cinc-auditor shell -t k8s-container:///test-distroless/test-distroless \
            --command "command('true && true').stdout" 2>&1) || exit_code=$?
          printf '%s\n' "$output"
          test "$exit_code" -ne 0
          grep -Fq 'Container has no shell - cannot execute complex command with operators: true && true' <<< "$output"

      - name: Collect diagnostics on failure
        if: failure()
        uses: $/.github/actions/collect-k8s-diagnostics
        with:
          artifact-name: integration-diagnostics-ruby-${{ matrix.ruby-version }}-k8s-${{ matrix.kubernetes.version }}

  # Job 4: Pod-to-Pod integration tests (InSpec running inside cluster)
  # This tests the scenario where InSpec runs from within a Kubernetes pod
  # and connects to other pods in the same cluster
  pod_to_pod_tests:
    runs-on: ubuntu-latest
    needs: [build_gem, unit_tests, kubernetes_versions]
    # No CHEF_LICENSE needed - using Cinc Auditor (open-source, license-free)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup test cluster with pods
        uses: $/.github/actions/setup-test-cluster
        with:
          k8s-version: ${{ fromJSON(needs.kubernetes_versions.outputs.kubernetes)[0].version }}
          kind-version: ${{ needs.kubernetes_versions.outputs.kind_version }}
          node-image: ${{ fromJSON(needs.kubernetes_versions.outputs.kubernetes)[0].image }}
          cluster-name: pod-to-pod-cluster
          create-ubuntu: 'true'
          create-alpine: 'true'

      - name: Download gem artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: train-k8s-container-gem

      - name: Create RBAC for in-cluster InSpec
        run: |
          # Create service account and RBAC for the InSpec scanner pod
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: inspec-scanner
            namespace: default
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: inspec-scanner-role
          rules:
          - apiGroups: [""]
            resources: ["pods", "pods/exec"]
            verbs: ["get", "list", "create"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: inspec-scanner-binding
          subjects:
          - kind: ServiceAccount
            name: inspec-scanner
            namespace: default
          roleRef:
            kind: ClusterRole
            name: inspec-scanner-role
            apiGroup: rbac.authorization.k8s.io
          EOF

      - name: Build Cinc Auditor scanner image
        env:
          KUBECTL_VERSION: ${{ fromJSON(needs.kubernetes_versions.outputs.kubernetes)[0].version }}
        run: |
          # Create a Dockerfile for the scanner pod with Cinc Auditor
          cat > Dockerfile.scanner <<'EOF'
          FROM ruby:3.3-slim

          # Install required packages (git needed for gemspec during plugin install)
          RUN apt-get update && apt-get install -y \
              curl \
              ca-certificates \
              git \
              && rm -rf /var/lib/apt/lists/*

          # Install kubectl
          ARG KUBECTL_VERSION
          RUN curl -fLO --proto '=https' --proto-redir '=https' "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
              && chmod +x kubectl \
              && mv kubectl /usr/local/bin/

          # Install Cinc Auditor (open-source, license-free InSpec distribution)
          RUN curl -fL --proto '=https' --proto-redir '=https' https://omnitruck.cinc.sh/install.sh -o /tmp/install-cinc.sh \
              && bash /tmp/install-cinc.sh -P cinc-auditor \
              && rm /tmp/install-cinc.sh

          # Copy and install the train-k8s-container gem
          COPY train-k8s-container-*.gem /tmp/
          RUN cinc-auditor plugin install /tmp/train-k8s-container-*.gem

          # Set working directory
          WORKDIR /work

          # Default command
          CMD ["sleep", "infinity"]
          EOF

          # Build the image
          docker build --build-arg KUBECTL_VERSION="$KUBECTL_VERSION" -f Dockerfile.scanner -t cinc-scanner:local .

          # Load into kind cluster
          kind load docker-image cinc-scanner:local --name pod-to-pod-cluster

      - name: Deploy Cinc Auditor scanner pod
        run: |
          # Create the scanner pod with the service account
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: cinc-scanner
            namespace: default
          spec:
            serviceAccountName: inspec-scanner
            containers:
            - name: scanner
              image: cinc-scanner:local
              imagePullPolicy: Never
              command: ["sleep", "infinity"]
          EOF

          # Wait for scanner pod
          kubectl wait --for=condition=Ready pod/cinc-scanner --timeout=180s

      - name: Create multi-container pod for same-pod testing
        run: |
          # Create multi-container pod using the pre-built cinc-scanner:local image
          # This tests scanning a sibling container within the same pod
          # The scanner container already has Cinc Auditor + plugin installed
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: multi-container-pod
            namespace: default
          spec:
            serviceAccountName: inspec-scanner
            containers:
            - name: scanner
              image: cinc-scanner:local
              imagePullPolicy: Never
              command: ["sleep", "infinity"]
            - name: target
              image: ubuntu:24.04
              command: ["sleep", "infinity"]
          EOF

          # Wait for multi-container pod
          kubectl wait --for=condition=Ready pod/multi-container-pod --timeout=120s

      - name: Verify Cinc Auditor installation
        run: |
          # Verify Cinc Auditor is installed
          kubectl exec cinc-scanner -- cinc-auditor version
          kubectl exec cinc-scanner -- cinc-auditor plugin list

      - name: Test pod-to-pod detect
        run: |
          echo "Testing Cinc Auditor detect from scanner pod to test-ubuntu..."
          kubectl exec cinc-scanner -- cinc-auditor detect -t k8s-container:///test-ubuntu/test-ubuntu

          echo "Testing Cinc Auditor detect from scanner pod to test-alpine..."
          kubectl exec cinc-scanner -- cinc-auditor detect -t k8s-container:///test-alpine/test-alpine

      - name: Test pod-to-pod commands
        run: |
          echo "Testing Cinc Auditor shell commands from scanner pod..."

          # Test Ubuntu target
          kubectl exec cinc-scanner -- cinc-auditor shell \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --command "command('whoami').stdout"

          kubectl exec cinc-scanner -- cinc-auditor shell \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --command "user('root').exists?"

          # Test Alpine target
          kubectl exec cinc-scanner -- cinc-auditor shell \
            -t k8s-container:///test-alpine/test-alpine \
            --command "command('cat /etc/alpine-release').stdout"

      - name: Test pod-to-pod with simple profile
        run: |
          # Create a simple test profile inside the scanner pod
          kubectl exec cinc-scanner -- mkdir -p /work/test-profile/controls

          kubectl exec cinc-scanner -- bash -c 'cat > /work/test-profile/inspec.yml << EOF
          name: pod-to-pod-test
          version: 0.1.0
          supports:
            - platform-family: linux
          EOF'

          kubectl exec cinc-scanner -- bash -c 'cat > /work/test-profile/controls/example.rb << EOF
          control "pod-connectivity-1" do
            impact 1.0
            title "Verify pod-to-pod connectivity"
            desc "Ensure Cinc Auditor can run controls against another pod"

            describe user("root") do
              it { should exist }
            end

            describe file("/etc/os-release") do
              it { should exist }
            end
          end
          EOF'

          # Run the profile against target pods
          echo "Running profile against test-ubuntu..."
          kubectl exec cinc-scanner -- cinc-auditor exec /work/test-profile \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --reporter cli json:/work/pod-to-pod-ubuntu.json

          echo "Running profile against test-alpine..."
          kubectl exec cinc-scanner -- cinc-auditor exec /work/test-profile \
            -t k8s-container:///test-alpine/test-alpine \
            --reporter cli json:/work/pod-to-pod-alpine.json

      - name: Test with real STIG profile
        run: |
          echo "Running canonical Ubuntu 24.04 STIG baseline against test-ubuntu..."
          kubectl exec cinc-scanner -- cinc-auditor exec \
            https://github.com/mitre/canonical-ubuntu-24.04-lts-stig-baseline/archive/refs/heads/main.tar.gz \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --reporter cli json:/work/stig-results.json || {
              status=$?
              [[ "$status" == 100 || "$status" == 101 ]] || exit "$status"
            }

      - name: Test same-pod container-to-container scanning
        run: |
          # This tests scanning a sibling container within the same pod
          # A realistic scenario where a scanner sidecar scans the main application container
          # The scanner container uses cinc-scanner:local image (pre-built with Cinc + plugin)

          # Verify Cinc Auditor and plugin are already installed
          echo "Verifying Cinc Auditor installation in multi-container-pod/scanner..."
          kubectl exec multi-container-pod -c scanner -- cinc-auditor version
          kubectl exec multi-container-pod -c scanner -- cinc-auditor plugin list

          # Test same-pod container-to-container detect
          echo "Testing same-pod container-to-container detect..."
          kubectl exec multi-container-pod -c scanner -- \
            cinc-auditor detect -t k8s-container:///multi-container-pod/target

          # Test same-pod container-to-container shell command
          echo "Testing same-pod container-to-container shell command..."
          kubectl exec multi-container-pod -c scanner -- \
            cinc-auditor shell -t k8s-container:///multi-container-pod/target \
            --command "command('cat /etc/os-release').stdout"

          echo "✅ Same-pod container-to-container scanning works!"

      - name: Collect pod test results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/pod-results"
          for report in pod-to-pod-ubuntu pod-to-pod-alpine stig-results; do
            kubectl cp "cinc-scanner:/work/$report.json" "$RUNNER_TEMP/pod-results/$report.json" || true
          done

      - name: Upload pod test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pod-to-pod-results
          path: ${{ runner.temp }}/pod-results/*.json
          retention-days: 5

      - name: Collect diagnostics on failure
        if: failure()
        uses: $/.github/actions/collect-k8s-diagnostics
        with:
          artifact-name: pod-to-pod-diagnostics
          service-account: system:serviceaccount:default:inspec-scanner

  regression_compare:
    runs-on: ubuntu-latest
    needs: [build_gem, kubernetes_versions]
    env:
      PROFILE_PATH: test/fixtures/profiles/inspec-resource-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: $/.github/actions/setup-ruby

      - name: Download gem artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: train-k8s-container-gem

      - name: Setup test cluster
        uses: $/.github/actions/setup-test-cluster
        with:
          k8s-version: ${{ fromJSON(needs.kubernetes_versions.outputs.kubernetes)[0].version }}
          kind-version: ${{ needs.kubernetes_versions.outputs.kind_version }}
          node-image: ${{ fromJSON(needs.kubernetes_versions.outputs.kubernetes)[0].image }}
          cluster-name: regression-cluster
          create-ubuntu: 'true'
          create-alpine: 'false'
          create-distroless: 'false'

      - name: Setup Cinc Auditor with SAF CLI
        uses: $/.github/actions/setup-cinc-auditor
        with:
          install-saf-cli: 'true'

      # ============================================
      # BASELINE: Original train-k8s-container (inspec/train-k8s-container)
      # ============================================
      - name: "BASELINE: Clone and build original train-k8s-container"
        run: |
          echo "Cloning original train-k8s-container from inspec/train-k8s-container..."
          git clone https://github.com/inspec/train-k8s-container.git /tmp/original-train-k8s-container
          cd /tmp/original-train-k8s-container
          echo "Building original gem..."
          gem build train-k8s-container.gemspec
          ls -la ./*.gem
          echo "Installing original gem..."
          cinc-auditor plugin install train-k8s-container-*.gem
          cinc-auditor plugin list

      - name: "BASELINE: Run regression tests"
        run: |
          echo "Running regression tests with original gem..."
          cinc-auditor exec "$PROFILE_PATH" \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --reporter cli json:baseline-results.json || {
              status=$?
              [[ "$status" == 100 || "$status" == 101 ]] || exit "$status"
            }

          echo "Baseline test completed."

      - name: "BASELINE: Uninstall original gem"
        run: |
          echo "Uninstalling original train-k8s-container gem..."
          cinc-auditor plugin uninstall train-k8s-container
          cinc-auditor plugin list

      # ============================================
      # TEST: MITRE fork (current PR)
      # ============================================
      - name: "TEST: Install MITRE fork gem"
        run: |
          echo "Installing MITRE fork gem from PR..."
          cinc-auditor plugin install train-k8s-container-*.gem
          cinc-auditor plugin list

      - name: "TEST: Run regression tests"
        run: |
          echo "Running regression tests with MITRE fork..."
          cinc-auditor exec "$PROFILE_PATH" \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --reporter cli json:current-results.json || {
              status=$?
              [[ "$status" == 100 || "$status" == 101 ]] || exit "$status"
            }

          echo "Current test completed."

      - name: Compare results
        run: |
          echo "Checking overall results against the original plugin's thresholds..."
          saf generate threshold --input baseline-results.json --output "$RUNNER_TEMP/baseline-threshold.yml"
          saf validate threshold --input current-results.json --templateFile "$RUNNER_TEMP/baseline-threshold.yml"

          echo "Checking for new failing or errored control IDs..."
          jq -en --slurpfile baseline baseline-results.json --slurpfile current current-results.json '
            def failures:
              [.profiles[].controls[] | select(any(.results[]; .status == "failed" or .status == "error")) | .id];
            (($current[0] | failures) - ($baseline[0] | failures)) as $new
            | if $new == [] then true else error("New failing controls: " + ($new | join(", "))) end
          '
          echo "=== Baseline summary ==="
          saf summary --input baseline-results.json 2>/dev/null
          echo "=== Current summary ==="
          saf summary --input current-results.json 2>/dev/null

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: regression-results
          path: |
            baseline-results.json
            current-results.json
          retention-days: 30

      - name: Collect diagnostics on failure
        if: failure()
        uses: $/.github/actions/collect-k8s-diagnostics
        with:
          artifact-name: regression-diagnostics

  unit_tests:
    runs-on: ubuntu-latest
    permissions: {}
    needs: unit_tests_matrix
    if: ${{ always() }}
    steps:
      - name: Require all unit tests to pass
        env:
          RESULT: ${{ needs.unit_tests_matrix.result }}
        run: test "$RESULT" = success

  integration_tests:
    runs-on: ubuntu-latest
    permissions: {}
    needs: integration_tests_matrix
    if: ${{ always() }}
    steps:
      - name: Require all integration tests to pass
        env:
          RESULT: ${{ needs.integration_tests_matrix.result }}
        run: test "$RESULT" = success
