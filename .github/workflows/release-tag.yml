name: Release on Tag

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write  # RubyGems trusted publishing

env:
  RUBY_VERSION: '3.3'

jobs:
  release:
    runs-on: ubuntu-latest
    # CI already passed via branch protection - no need to re-run tests

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Build gem
        run: gem build train-k8s-container.gemspec

      - name: Upload gem to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            train-k8s-container-mitre-*.gem

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish gem to RubyGems
        run: gem push train-k8s-container-mitre-*.gem
