name: Regression Comparison

# Compare behavior between original train-k8s-container gem and MITRE fork
# Ensures the fork produces equivalent or better results for the same tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

env:
  RUBY_VERSION: '3.3'
  K8S_VERSION: 'v1.30.0'
  # Path to the validation profile (checked into repo)
  PROFILE_PATH: test/fixtures/profiles/inspec-resource-validation

jobs:
  regression-compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Build MITRE fork gem
        run: gem build train-k8s-container.gemspec

      - name: Setup test cluster
        uses: ./.github/actions/setup-test-cluster
        with:
          k8s-version: ${{ env.K8S_VERSION }}
          cluster-name: regression-cluster
          create-ubuntu: 'true'
          create-alpine: 'false'
          create-distroless: 'false'

      - name: Setup Cinc Auditor with SAF CLI
        uses: ./.github/actions/setup-cinc-auditor
        with:
          install-saf-cli: 'true'

      # ============================================
      # BASELINE: Original train-k8s-container (inspec/train-k8s-container)
      # ============================================
      - name: "BASELINE: Clone and build original train-k8s-container"
        run: |
          echo "Cloning original train-k8s-container from inspec/train-k8s-container..."
          git clone https://github.com/inspec/train-k8s-container.git /tmp/original-train-k8s-container
          cd /tmp/original-train-k8s-container
          echo "Building original gem..."
          gem build train-k8s-container.gemspec
          ls -la *.gem
          echo "Installing original gem..."
          cinc-auditor plugin install train-k8s-container-*.gem
          cinc-auditor plugin list

      - name: "BASELINE: Run regression tests"
        run: |
          echo "Running regression tests with original gem..."
          cinc-auditor exec ${{ env.PROFILE_PATH }} \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --reporter cli json:baseline-results.json || true

          echo "Baseline test completed."

      - name: "BASELINE: Uninstall original gem"
        run: |
          echo "Uninstalling original train-k8s-container gem..."
          cinc-auditor plugin uninstall train-k8s-container
          cinc-auditor plugin list

      # ============================================
      # TEST: MITRE fork (current PR)
      # ============================================
      - name: "TEST: Install MITRE fork gem"
        run: |
          echo "Installing MITRE fork gem from PR..."
          cinc-auditor plugin install train-k8s-container-*.gem
          cinc-auditor plugin list

      - name: "TEST: Run regression tests"
        run: |
          echo "Running regression tests with MITRE fork..."
          cinc-auditor exec ${{ env.PROFILE_PATH }} \
            -t k8s-container:///test-ubuntu/test-ubuntu \
            --reporter cli json:current-results.json || true

          echo "Current test completed."

      # ============================================
      # COMPARE: Analyze differences
      # ============================================
      - name: Compare results with SAF CLI
        run: |
          # Suppress node warnings from SAF CLI eMASS module loading issues
          export NODE_NO_WARNINGS=1

          echo "=========================================="
          echo "BASELINE SUMMARY (inspec/train-k8s-container)"
          echo "=========================================="
          saf summary --input baseline-results.json 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "CURRENT SUMMARY (MITRE fork)"
          echo "=========================================="
          saf summary --input current-results.json 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "COMPARISON"
          echo "=========================================="

          # Extract pass/fail counts for comparison
          baseline_passed=$(jq '[.profiles[].controls[].results[] | select(.status == "passed")] | length' baseline-results.json)
          baseline_failed=$(jq '[.profiles[].controls[].results[] | select(.status == "failed")] | length' baseline-results.json)
          baseline_skipped=$(jq '[.profiles[].controls[].results[] | select(.status == "skipped")] | length' baseline-results.json)

          current_passed=$(jq '[.profiles[].controls[].results[] | select(.status == "passed")] | length' current-results.json)
          current_failed=$(jq '[.profiles[].controls[].results[] | select(.status == "failed")] | length' current-results.json)
          current_skipped=$(jq '[.profiles[].controls[].results[] | select(.status == "skipped")] | length' current-results.json)

          echo "Baseline (inspec): Passed=$baseline_passed, Failed=$baseline_failed, Skipped=$baseline_skipped"
          echo "Current (MITRE):   Passed=$current_passed, Failed=$current_failed, Skipped=$current_skipped"

          # Check for regressions (more failures in current than baseline)
          if [ "$current_failed" -gt "$baseline_failed" ]; then
            echo ""
            echo "WARNING: MITRE fork has MORE failures than baseline!"
            echo "   Baseline failures: $baseline_failed"
            echo "   Current failures:  $current_failed"
            echo ""
            echo "This may indicate a regression. Please review the detailed results."

            # Show which controls differ
            echo ""
            echo "Controls with different results:"
            jq -r '.profiles[].controls[] | select(.results[].status == "failed") | .id' current-results.json | sort > current-failed.txt
            jq -r '.profiles[].controls[] | select(.results[].status == "failed") | .id' baseline-results.json | sort > baseline-failed.txt
            echo "New failures in MITRE fork:"
            comm -23 current-failed.txt baseline-failed.txt || echo "  (none)"

            exit 1
          fi

          # Check for improvements (fewer failures)
          if [ "$current_failed" -lt "$baseline_failed" ]; then
            echo ""
            echo "IMPROVEMENT: MITRE fork has FEWER failures than baseline!"
            echo "   Baseline failures: $baseline_failed"
            echo "   Current failures:  $current_failed"
          fi

          # Check if results are equivalent
          if [ "$current_passed" -eq "$baseline_passed" ] && [ "$current_failed" -eq "$baseline_failed" ]; then
            echo ""
            echo "EQUIVALENT: Results match between baseline and MITRE fork"
          fi

          echo ""
          echo "Regression comparison completed successfully."

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: |
            baseline-results.json
            current-results.json
          retention-days: 30

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -A

          echo "=== Test Pod Details ==="
          kubectl describe pod test-ubuntu

          echo "=== Baseline Results ==="
          cat baseline-results.json | jq '.profiles[].controls[] | {id: .id, results: .results[].status}' || true

          echo "=== Current Results ==="
          cat current-results.json | jq '.profiles[].controls[] | {id: .id, results: .results[].status}' || true
